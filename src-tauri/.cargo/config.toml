# Compilazione del supporto ASIO (cpal + bindgen).
# L'SDK ASIO di Steinberg non e' nel repository (licenza): su ogni PC va estratto in src-tauri/asio-sdk
# (cartella ignorata da git) in modo che dentro ci siano direttamente "common", "host", "driver"...
# Il percorso e' relativo a questa cartella, quindi e' lo stesso su tutti i PC. Vedi docs/SVILUPPO.md.
# LIBCLANG_PATH non va messo qui: [env] vale su ogni sistema operativo e, se e' impostato, clang-sys cerca solo
# in quel percorso. Senza, trova da solo sia C:/Program Files/LLVM sia i Command Line Tools di macOS.
[env]
CPAL_ASIO_DIR = { value = "asio-sdk", relative = true }

# Su macOS le librerie precompilate di ONNX Runtime richiedono almeno macOS 13.4:
# senza questo flag il linker usa 11.0 e fallisce su ___isPlatformVersionAtLeast.
[target.'cfg(target_os = "macos")']
rustflags = [
  "-C", "link-arg=-Wl,-macosx_version_min,13.4.0",
  # ___isPlatformVersionAtLeast vive nel compiler-rt di clang; rustc linka con -nodefaultlibs e non lo include.
  "-C", "link-arg=/Library/Developer/CommandLineTools/usr/lib/clang/21/lib/darwin/libclang_rt.osx.a",
]

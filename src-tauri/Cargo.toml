[package]
name = "spinlab"
version = "0.1.0"
edition = "2021"
description = "SpinLab DJ"

[lib]
name = "spinlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
signalsmith-stretch = "0.1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
hound = "3.5"
libloading = "0.8"
ort = { version = "=2.0.0-rc.15" }
flacenc = "0.5.1"
claxon = "0.4.3"

# licenze: certificato firmato Ed25519 e impronta del computer; client HTTP interno (TLS rustls), usato anche per il modello degli stem su Android dove curl non esiste
ed25519-dalek = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# aggiornamenti automatici (solo desktop)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
# uscita audio con AAudio a bassa latenza (cpal non ne espone le opzioni); stessa versione e feature usate da cpal
oboe = { version = "0.6", features = ["java-interface"] }

# MIDI (midir) non supporta Android
[target.'cfg(not(target_os = "android"))'.dependencies]
midir = "0.10"

# ASIO e DirectML esistono solo su Windows
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
# solo per leggere i nomi dei driver ASIO: elencare i dispositivi con cpal carica ogni driver e ferma quello in uso
asio-sys = "0.2"
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

# su macOS la GPU va' via CoreML
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }

# `cargo tauri dev` compila in profilo dev: senza ottimizzazioni decodifica e analisi sono 30-40 volte piu' lente
[profile.dev]
opt-level = 3
# con opt-level 3 la cache incrementale si corrompe e il linker non trova piu' simboli: meglio senza
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
